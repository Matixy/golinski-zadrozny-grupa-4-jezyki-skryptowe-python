{% if error_messages %}
<div class="d-flex flex-column gap-2 p-2">
  {% for error in error_messages %}
  <div class="alert alert-danger show mb-0 d-flex justify-content-between" role="alert">
    {{ error.message }}
    <button
      type="button"
      class="btn-close"

      hx-post="/remove_error/{{ error.id }}"
      hx-target="closest .alert"
      hx-swap="outerHTML"
    ></button>
  </div>
  {% endfor %}
</div>
{% endif %}
